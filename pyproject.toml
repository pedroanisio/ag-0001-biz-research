[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-agent"
version = "0.1.0"
description = "Evidence-driven company intelligence research fleet"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bi-agent = "bi_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bi_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["bi_agent"]

[tool.coverage.report]
fail_under = 90
show_missing = true
